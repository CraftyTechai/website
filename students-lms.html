<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard — CraftyTech AI</title>
<link rel="icon" href="img/favicon.ico">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .progress-track{ background: rgba(255,255,255,0.06); border-radius: 999px; height: 10px; overflow: hidden; margin-top: 8px; }
  .progress-fill{ height: 100%; background: linear-gradient(90deg, var(--teal), var(--teal-bright)); }
</style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <img src="img/logo.png" alt="CraftyTech AI logo">
      <span class="brand-word">CraftyTech<span>AI</span></span>
    </a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="courses.html">Courses</a>
      <a href="students-portal.html">Back to Portal</a>
      <button id="signoutBtn" class="btn primary sm" style="margin-left:6px;">Sign out</button>
    </nav>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
  </div>
</header>

<main>
  <section class="page-banner">
    <div class="container">
      <div class="eyebrow">My Dashboard</div>
      <h1 id="studentName">Student</h1>
      <p class="muted" id="studentEmail"></p>
      <p class="muted" id="joinedDate"></p>
    </div>
  </section>

  <section class="block" style="padding-top:20px;">
    <div class="container grid cols-2" style="align-items:start;">
      <div class="bcard">
        <h3 style="margin-bottom:16px;">Enrolled Courses</h3>
        <div id="enrolledList" class="muted">No courses enrolled yet.</div>
      </div>
      <div class="bcard">
        <h3 style="margin-bottom:16px;">Certificates</h3>
        <div id="certificatesList" class="muted">Your certificates will appear here.</div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer__bottom" style="border-top:none; padding-top:0;">
      <div class="muted">© <span data-year></span> CraftyTech AI. All rights reserved.</div>
    </div>
  </div>
</footer>

<script src="assets/js/main.js"></script>
<script>
(function () {
  var studentData = null;
  try { studentData = JSON.parse(localStorage.getItem('studentData') || 'null'); } catch (e) { studentData = null; }
  var email = localStorage.getItem('studentEmail');
  if (!email && !studentData) { window.location.href = 'students-portal.html'; return; }

  function render(user) {
    document.getElementById('studentName').textContent = user.name || (user.email ? user.email.split('@')[0] : 'Student');
    document.getElementById('studentEmail').textContent = user.email || '';
    var joined = user.joined ? new Date(user.joined).toLocaleDateString() : '';
    document.getElementById('joinedDate').textContent = joined ? 'Member since ' + joined : '';

    var enrolledEl = document.getElementById('enrolledList');
    if (Array.isArray(user.enrolled) && user.enrolled.length) {
      if (user.progress) {
        enrolledEl.innerHTML = user.enrolled.map(function (c) {
          var p = user.progress[c] || 0;
          return '<div style="margin-bottom:16px;"><div style="font-weight:600;color:#fff;">' + c + '</div>' +
                 '<div class="progress-track"><div class="progress-fill" style="width:' + p + '%;"></div></div>' +
                 '<div class="muted" style="font-size:0.82rem;margin-top:4px;">' + p + '% complete</div></div>';
        }).join('');
      } else {
        enrolledEl.innerHTML = '<ul>' + user.enrolled.map(function (c) { return '<li>' + c + '</li>'; }).join('') + '</ul>';
      }
    } else {
      enrolledEl.textContent = 'No courses enrolled yet.';
    }

    var certsEl = document.getElementById('certificatesList');
    if (Array.isArray(user.certificates) && user.certificates.length) {
      certsEl.innerHTML = '<ul>' + user.certificates.map(function (c) { return '<li>' + c + '</li>'; }).join('') + '</ul>';
    } else {
      certsEl.textContent = 'Your verified certificates will appear here.';
    }
  }

  if (studentData) {
    render(studentData);
  } else {
    fetch('students.json', { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('network');
      return r.json();
    }).then(function (list) {
      var user = list.find(function (u) { return u.email.toLowerCase() === email.toLowerCase(); });
      if (!user) { localStorage.removeItem('studentEmail'); window.location.href = 'students-portal.html'; return; }
      localStorage.setItem('studentData', JSON.stringify(user));
      render(user);
    }).catch(function () {
      document.getElementById('studentName').textContent = email.split('@')[0];
      document.getElementById('studentEmail').textContent = email;
    });
  }

  document.getElementById('signoutBtn').addEventListener('click', function () {
    try { sessionStorage.setItem('autoSignedOut', '1'); } catch (e) {}
    localStorage.removeItem('studentEmail');
    localStorage.removeItem('studentData');
    window.location.href = 'students-portal.html';
  });

  function autoLogout() {
    try { sessionStorage.setItem('autoSignedOut', '1'); } catch (e) {}
    try { localStorage.removeItem('studentEmail'); localStorage.removeItem('studentData'); } catch (e) {}
  }
  window.addEventListener('beforeunload', autoLogout);
  window.addEventListener('pagehide', autoLogout);
  document.addEventListener('visibilitychange', function () { if (document.hidden) autoLogout(); });
})();
</script>
</body>
</html>
