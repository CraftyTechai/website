<!DOCTYPE html>
<html lang="en">
        <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>Verify Certificates — CraftyTech.ai</title>
                <link rel="stylesheet" href="style.css">
                <style>
                    body {
                        margin: 0;
                        min-height: 100vh;
                        background: radial-gradient(circle at top, rgba(59, 130, 246, 0.18), transparent 30%),
                                    linear-gradient(180deg, #020617 0%, #071223 100%);
                        color: #e2efff;
                        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                    }

                    .container {
                        max-width: 1180px;
                        margin: 0 auto;
                        padding: 0 20px;
                    }

                    .site-header {
                        background: rgba(2, 10, 25, 0.92);
                        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
                        position: sticky;
                        top: 0;
                        z-index: 50;
                    }

                    .header-inner {
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        gap: 18px;
                        padding: 18px 0;
                    }

                    .brand {
                        display: flex;
                        align-items: center;
                        gap: 12px;
                        text-decoration: none;
                        color: #fff;
                    }

                    .brand-name {
                        font-size: 1.2rem;
                        font-weight: 800;
                        color: #3b82f6;
                    }

                    .brand-tagline {
                        font-size: 0.9rem;
                        color: #94a3b8;
                    }

                    .main-nav {
                        display: flex;
                        flex-wrap: wrap;
                        gap: 12px;
                    }

                    .nav-link {
                        color: #cbd5e1;
                        text-decoration: none;
                        font-weight: 600;
                        transition: color 0.2s ease;
                    }

                    .nav-link:hover {
                        color: #3b82f6;
                    }

                    .nav-link.cta {
                        padding: 10px 18px;
                        border-radius: 999px;
                        background: rgba(59, 130, 246, 0.18);
                    }

                    main {
                        padding: 80px 0 60px;
                    }

                    section {
                        max-width: 700px;
                        margin: 0 auto;
                        padding: 36px 36px 32px;
                        background: rgba(255, 255, 255, 0.04);
                        border: 1px solid rgba(255, 255, 255, 0.08);
                        border-radius: 24px;
                        box-shadow: 0 36px 90px rgba(0, 0, 0, 0.2);
                    }

                    section h2 {
                        margin: 0 0 22px;
                        font-size: 2.1rem;
                        color: #ffffff;
                    }

                    form {
                        display: grid;
                        gap: 18px;
                    }

                    label {
                        color: #94a3b8;
                        font-size: 0.95rem;
                    }

                    input {
                        width: 100%;
                        padding: 16px 18px;
                        border-radius: 16px;
                        border: 1px solid rgba(255, 255, 255, 0.12);
                        background: rgba(255, 255, 255, 0.04);
                        color: #f8fafc;
                        font-size: 1rem;
                    }

                    input:focus {
                        outline: 2px solid rgba(59, 130, 246, 0.45);
                        outline-offset: 2px;
                    }

                    button {
                        cursor: pointer;
                        width: fit-content;
                        padding: 14px 22px;
                        border: none;
                        border-radius: 16px;
                        background: #3b82f6;
                        color: #ffffff;
                        font-weight: 700;
                        transition: background 0.2s ease;
                    }

                    button:hover {
                        background: #2563eb;
                    }

                    #verification-result {
                        margin-top: 18px;
                        font-size: 0.98rem;
                        color: #cbd5e1;
                        min-height: 72px;
                    }

                    .site-footer {
                        background: rgba(2, 10, 25, 0.92);
                        border-top: 1px solid rgba(255, 255, 255, 0.06);
                        padding: 22px 0 28px;
                        color: #94a3b8;
                    }

                    .footer-flex {
                        display: flex;
                        justify-content: space-between;
                        gap: 24px;
                        flex-wrap: wrap;
                    }

                    .muted {
                        color: #94a3b8;
                    }

                    @media (max-width: 820px) {
                        .header-inner,
                        .footer-flex {
                            flex-direction: column;
                            align-items: flex-start;
                        }

                        .main-nav {
                            width: 100%;
                        }

                        section {
                            padding: 28px 24px;
                        }
                    }
                </style>
        </head>
        <body>
        <header class="site-header">
            <div class="container header-inner" style="display: flex; justify-content: space-between; align-items: center;">
                <a href="index.html" class="brand">
                        <div class="brand-logo-box">
                            <img src="img/logo.png" alt="CraftyTech.ai Logo" style="width: 40px; height: auto;">
                        </div>
                    <div class="brand-text">
                        <div class="brand-name">CraftyTech.ai</div>
                        <div class="brand-tagline">Digital Solutions</div>
                    </div>
                </a>
                <nav class="main-nav">
                    <a href="students.html" class="nav-link">Students Careers</a>
                    <a href="courses.html" class="nav-link">Courses</a>
                    <a href="index.html" class="nav-link">Services</a>
                    <a href="carrers.html" class="nav-link">Careers</a>
                    <a href="#contact" class="nav-link cta">Start Project</a>
                </nav>
            </div>
        </header>
    <main>
        <section>
            <h2>Certificate Verification</h2>
            <form id="certificate-verification-form">
                <label for="certificate-id">Certificate ID:</label>
                <input type="text" id="certificate-id" name="certificate-id" required>
                <button type="submit">Verify</button>
            </form>
            <div id="verification-result"></div>
        </section>
    </main>
        <footer class="site-footer container">
                <div class="footer-flex">
                    <div>
                        <div style="font-weight: 800; font-size: 16px; color: var(--text-primary);">CraftyTech.ai</div>
                        <div class="muted" style="margin-top: 8px;">Digital Solutions.</div>
                    </div>
                    <div>
                         <div class="muted">© 2026 CraftyTech.ai — All rights reserved.</div>
                         <div class="muted" style="margin-top:4px">Visakhapatnam • India</div>
                    </div>
                </div>
        </footer>
    <script>
        document.getElementById('certificate-verification-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const certificateId = document.getElementById('certificate-id').value;
            const resultDiv = document.getElementById('verification-result');

            // Simulate verification logic
            if (certificateId === '12345') {
                resultDiv.innerHTML = '<p style="color: green;">Certificate is valid.</p>' +
                                      '<p>Certificate ID: 12345</p>' +
                                      '<p> Name: John Doe</p>' +
                                      '<p>Course: Web Development</p>' +
                                      '<p>Completion Date: January 15, 2026</p>';
            } else if (certificateId === 'CT001') {
                resultDiv.innerHTML = '<p style="color: green;">Certificate is valid.</p>' +
                                      '<p>Certificate ID: CT001</p>' +
                                      '<p>Course: Data Science</p>' +
                                      '<p>Completion Date: February 10, 2026</p>';
            } else {
                resultDiv.textContent = 'Certificate is invalid.';
                resultDiv.style.color = 'red';
            }
        });
    </script>
</body>
</html>
